# Bloc nginx pour math.giet.fr, à ajouter dans le vhost du serveur
# (/etc/nginx/sites-available/giet, qui regroupe tous les domaines), à sa place
# dans l'ordre alphabétique, entre mlt-api et musics.
#
# Rien d'autre à poser : la redirection 80 → 443 est commune à tous les
# sous-domaines (premier bloc du fichier), et le certificat joker *.giet.fr /
# *.giet.xyz couvre déjà math.giet.fr via snippets/giet-https.conf.
#
# Ce vhost ne connaît RIEN de l'application : le repli SPA et le relais /api/
# vers MltStore sont faits par le nginx DU CONTENEUR (nginx.conf à la racine du
# dépôt). Ne pas dupliquer ces règles ici.
#
# Puis : sudo nginx -t && sudo systemctl reload nginx

server {
    server_name math.giet.fr math.giet.xyz;
    include snippets/giet-https.conf;
    location / {
        proxy_pass http://192.168.1.16:40303/;
        include snippets/giet-proxy.conf;
    }
}
