# Blocs nginx pour math.giet.fr, à ajouter dans le vhost du serveur
# (/etc/nginx/sites-available/giet.xyz, qui regroupe tous les domaines).
#
# Ce vhost ne connaît RIEN de l'application : le routage interne — repli SPA et
# /api/ vers MltStore — est fait par le nginx DU CONTENEUR (nginx.conf à la
# racine du dépôt). Ne pas dupliquer ces règles ici, elles se contrediraient.
#
# ORDRE DES OPÉRATIONS : le bloc 443 référence un certificat qui n'existe pas
# encore. L'ajouter avant d'avoir le certificat rend `nginx -t` invalide, et
# certbot refuse alors de travailler puisqu'il a besoin d'une configuration
# valide. Il faut donc, dans cet ordre :
#
#   1. ajouter SEULEMENT le bloc 80 ci-dessous, puis
#        nginx -t && systemctl reload nginx
#   2. obtenir le certificat sans toucher aux vhosts :
#        certbot certonly --nginx -d math.giet.fr
#   3. ajouter alors le bloc 443, puis
#        nginx -t && systemctl reload nginx

server { listen 80; server_name math.giet.fr; return 301 https://$host$request_uri; }

server {
    listen 443 ssl http2;
    server_name math.giet.fr;

    ssl_certificate /etc/letsencrypt/live/math.giet.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/math.giet.fr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://192.168.1.16:40302/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
