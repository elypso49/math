<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Code enfant</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#2E7D6B;text-decoration:none}
button{font-family:inherit;cursor:pointer}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 24px 28px; display: flex; flex-direction: column; gap: 26px; background: #F6F5F1; color: #1E2A28; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif;">
  <a href="Main.dc.html" style="display: flex; align-items: center; gap: 6px; font-size: 15px; color: #5B6664;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>Changer de profil</a>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;">
    <div style="display: flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 50%; background: #E3F1EC; color: #1F5C3A; font-size: 28px; font-weight: 700;">A</div>
    <h1 style="margin: 4px 0 0; font-size: 26px; font-weight: 700;">Bonjour Enfant A !</h1>
    <p style="margin: 0; font-size: 17px; color: #5B6664;">Entre ton code secret.</p>
  </div>

  <div aria-live="polite" style="display: flex; justify-content: center; gap: 12px;">
    <div style="width: 56px; height: 64px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 2px solid #C9C7BE; border-radius: 14px; background: #FFFFFF; font-size: 26px; color: #2E7D6B;">{{ slot1 }}</div>
    <div style="width: 56px; height: 64px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 2px solid #C9C7BE; border-radius: 14px; background: #FFFFFF; font-size: 26px; color: #2E7D6B;">{{ slot2 }}</div>
    <div style="width: 56px; height: 64px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 2px solid #C9C7BE; border-radius: 14px; background: #FFFFFF; font-size: 26px; color: #2E7D6B;">{{ slot3 }}</div>
    <div style="width: 56px; height: 64px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; border: 2px solid #C9C7BE; border-radius: 14px; background: #FFFFFF; font-size: 26px; color: #2E7D6B;">{{ slot4 }}</div>
  </div>

  <div style="display: flex; flex-wrap: wrap; gap: 12px;">
    <sc-for list="{{ digits }}" as="digit" hint-placeholder-count="10">
      <button type="button" onClick="{{ digit.pick }}" aria-label="{{ digit.label }}" style="flex: 0 0 calc(33.33% - 8px); height: 68px; box-sizing: border-box; border: 2px solid #C9C7BE; border-radius: 18px; background: #FFFFFF; color: #1E2A28; font-size: 30px; font-weight: 700;">{{ digit.label }}</button>
    </sc-for>
    <button type="button" onClick="{{ erase }}" aria-label="Effacer le dernier chiffre" style="flex: 0 0 calc(33.33% - 8px); height: 68px; box-sizing: border-box; border: 2px solid #C9C7BE; border-radius: 18px; background: #E9E7E0; color: #1E2A28; display: flex; align-items: center; justify-content: center;"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg></button>
  </div>

  <sc-if value="{{ complete }}" hint-placeholder-val="{{ false }}">
    <a href="Home.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 10px; height: 62px; border-radius: 18px; background: #2E7D6B; color: #FFFFFF; font-size: 20px; font-weight: 700;">Entrer<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></a>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { typed: '' };

  renderVals() {
    const typed = this.state.typed;
    const press = digit => () => this.setState({ typed: (this.state.typed + digit).slice(0, 4) });
    const digits = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0'].map(digit => ({ label: digit, pick: press(digit) }));
    return {
      slot1: typed[0] ? '●' : '',
      slot2: typed[1] ? '●' : '',
      slot3: typed[2] ? '●' : '',
      slot4: typed[3] ? '●' : '',
      complete: typed.length === 4,
      digits,
      erase: () => this.setState({ typed: this.state.typed.slice(0, -1) }),
    };
  }
}
</script>
</body>
</html>
